# Base44 sandbox web entry point for the jzo2o backend services.
#
# The repository contains no browser front end (the PC / app / mini-program
# clients live outside it), so port 3000 serves a small landing page that links
# to the real Knife4j API documentation of each running service and reverse
# proxies every service context path. Nothing here changes application
# behaviour: requests are forwarded unchanged, with the original path.
#
# Upstreams are resolved per request (variable + Docker's embedded DNS) so that
# a service which is not running does not stop nginx from starting.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    location /foundations/     { set $up http://foundations:11509;     proxy_pass $up$request_uri; }
    location /customer/        { set $up http://customer:11502;        proxy_pass $up$request_uri; }
    location /publics/         { set $up http://publics:11503;         proxy_pass $up$request_uri; }
    location /orders-manager/  { set $up http://orders-manager:11504;  proxy_pass $up$request_uri; }
    location /trade/           { set $up http://trade:11505;           proxy_pass $up$request_uri; }
    location /orders-seize/    { set $up http://orders-seize:11506;    proxy_pass $up$request_uri; }
    location /orders-dispatch/ { set $up http://orders-dispatch:11507; proxy_pass $up$request_uri; }
    location /orders-history/  { set $up http://orders-history:11508;  proxy_pass $up$request_uri; }
    location /market/          { set $up http://market:11510;          proxy_pass $up$request_uri; }

    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
