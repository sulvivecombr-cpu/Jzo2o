    # Needs the private artifact cn.xiaozhibang:evaluation-sdk:1.0-SNAPSHOT, which
    # is not published publicly, so the module cannot be built here yet. Enable
    # with `--profile customer` once that jar/dependency is available.
    profiles: ["customer"]
    image: eclipse-temurin:11-jre-alpine
    restart: on-failure
