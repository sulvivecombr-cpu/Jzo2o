      nacos-config-init: { condition: service_completed_successfully }
      builder: { condition: service_completed_successfully }
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:11510/market/doc.html || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 150s

  jzo2o-trade:
