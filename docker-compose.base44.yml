      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  nacos-data:
  mysql-data:
  rabbitmq-data:
  es-data:
  jzo2o-m2:
  jzo2o-build:
